name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -r requirements.lock pytest ruff bandit pip-audit detect-secrets
      - run: npm ci
      - run: python -m pytest
      - run: python -m compileall -q .
      - run: ruff check .
      - run: bandit -q -ll -r . -x tests
      - run: pip-audit -r requirements.lock
      - run: npm audit --omit=dev
      - name: Secret scan
        run: >-
          detect-secrets scan --all-files --exclude-files '(^|/)node_modules/' |
          python -c 'import json,sys; assert not json.load(sys.stdin)["results"]'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t maxread-ci .
